<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistem Evaluasi Pendidikan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#FFF5F7',
            dusty: '#D9A0B0',
            blush: '#FDB0C0',
            ink: '#333333',
            plum: '#4A2330',
            'rose-ink': '#8A4A5B',
            mint: { DEFAULT: '#CFEFE2', ink: '#25694E' },
            coral: { DEFAULT: '#FFD3CC', ink: '#A8402F' },
          },
          fontFamily: { sans: ['Nunito', 'Poppins', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          boxShadow: { soft: '0 4px 20px -6px rgba(217,160,176,0.35)' },
        },
      },
    };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { background: #FFF5F7; color: #333333; font-family: 'Nunito', 'Poppins', sans-serif; -webkit-font-smoothing: antialiased; }
    ::selection { background: #FDB0C0; color: #4A2330; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #D9A0B0aa; border-radius: 999px; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp .45s ease-out both; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; font-weight:800; font-size:.875rem; transition:all .2s; }
    .btn-primary { background:#D9A0B0; color:#4A2330; box-shadow:0 1px 2px rgba(0,0,0,.05); }
    .btn-primary:hover:not(:disabled) { background:#FDB0C0; transform:translateY(-2px); box-shadow:0 4px 20px -6px rgba(217,160,176,.5); }
    .btn-primary:active:not(:disabled) { transform:scale(.98); }
    .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
    .field { width:100%; border:1px solid rgba(217,160,176,.4); background:#fff; border-radius:.75rem; padding:0 1rem; font-size:.875rem; color:#333; box-shadow:0 1px 2px rgba(0,0,0,.04); transition:all .2s; outline:none; }
    .field:hover { border-color:#D9A0B0; }
    .field:focus { border-color:#FDB0C0; box-shadow:0 0 0 3px rgba(253,176,192,.45); }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    /* ===================== DATA ===================== */
    const exams = [
      { mapel: 'Matematika', guru: 'Bu Sari Wulandari', tanggal: 'Sen, 19 Okt 2026', waktu: '07.30 – 09.00', status: 'Segera' },
      { mapel: 'Bahasa Indonesia', guru: 'Pak Budi Santoso', tanggal: 'Rab, 21 Okt 2026', waktu: '09.30 – 11.00', status: 'Terjadwal' },
      { mapel: 'Fisika', guru: 'Bu Rina Marlina', tanggal: 'Jum, 23 Okt 2026', waktu: '07.30 – 09.30', status: 'Terjadwal' },
      { mapel: 'Bahasa Inggris', guru: 'Mr. Andre Pratama', tanggal: 'Sel, 27 Okt 2026', waktu: '10.00 – 11.30', status: 'Terjadwal' },
      { mapel: 'Biologi', guru: 'Bu Dewi Lestari', tanggal: 'Kam, 8 Okt 2026', waktu: '08.00 – 09.30', status: 'Selesai' },
    ];
    const students = [
      { nama: 'Aulia Rahmawati', kelas: 'XI IPA 1', ujian: 'Ulangan Harian Trigonometri', nilai: 92, status: 'Tuntas' },
      { nama: 'Bima Prakoso', kelas: 'XI IPA 1', ujian: 'Ulangan Harian Trigonometri', nilai: 78, status: 'Tuntas' },
      { nama: 'Citra Anggraini', kelas: 'XI IPA 2', ujian: 'Kuis Limit Fungsi', nilai: 64, status: 'Remedial' },
      { nama: 'Dimas Saputra', kelas: 'XI IPA 2', ujian: 'Kuis Limit Fungsi', nilai: 85, status: 'Tuntas' },
      { nama: 'Eka Putri Handayani', kelas: 'XI IPA 3', ujian: 'Ulangan Harian Trigonometri', nilai: 0, status: 'Menunggu' },
      { nama: 'Fajar Nugroho', kelas: 'XI IPA 3', ujian: 'Kuis Limit Fungsi', nilai: 58, status: 'Remedial' },
    ];
    const users = [
      { nama: 'Aulia Rahmawati', peran: 'Siswa', email: 'aulia@sekolah.sch.id', status: 'Aktif' },
      { nama: 'Bu Sari Wulandari', peran: 'Guru', email: 'sari@sekolah.sch.id', status: 'Aktif' },
      { nama: 'Gilang Ramadhan', peran: 'Siswa', email: 'gilang@sekolah.sch.id', status: 'Menunggu' },
      { nama: 'Pak Budi Santoso', peran: 'Guru', email: 'budi@sekolah.sch.id', status: 'Aktif' },
      { nama: 'Hana Maharani', peran: 'Siswa', email: 'hana@sekolah.sch.id', status: 'Menunggu' },
    ];
    const teachers = [
      'Bu Sari Wulandari – Matematika',
      'Pak Budi Santoso – Bahasa Indonesia',
      'Bu Rina Marlina – Fisika',
      'Mr. Andre Pratama – Bahasa Inggris',
      'Bu Dewi Lestari – Biologi',
    ];
    const ratingQs = [
      { id: 'materi', text: 'Guru menjelaskan materi dengan jelas dan mudah dipahami.' },
      { id: 'suasana', text: 'Guru menciptakan suasana kelas yang nyaman dan menyenangkan.' },
      { id: 'waktu', text: 'Guru memulai dan mengakhiri pelajaran tepat waktu.' },
      { id: 'adil', text: 'Guru bersikap adil dan menghargai semua siswa.' },
      { id: 'tanya', text: 'Guru memberi kesempatan bertanya dan menjawab dengan sabar.' },
    ];
    const fbOptions = ['Selalu', 'Sering', 'Kadang-kadang', 'Jarang'];
    const starLabels = ['Sangat kurang', 'Kurang', 'Cukup', 'Baik', 'Sangat baik'];

    const roles = {
      siswa: { label: 'Siswa', user: 'Aulia Rahmawati', icon: 'graduation-cap' },
      guru: { label: 'Guru', user: 'Bu Sari Wulandari', icon: 'users' },
      admin: { label: 'Admin', user: 'Admin Sekolah', icon: 'shield-check' },
    };
    const nav = {
      siswa: [
        { label: 'Ringkasan', go: 'siswa', icon: 'layout-dashboard' },
        { label: 'Jadwal Ujian', go: '', icon: 'calendar-days' },
        { label: 'Nilai Saya', go: '', icon: 'bar-chart-3' },
        { label: 'Evaluasi Guru', go: 'evaluasi', icon: 'message-square-heart' },
      ],
      guru: [
        { label: 'Ringkasan', go: 'guru', icon: 'layout-dashboard' },
        { label: 'Kelas Saya', go: '', icon: 'school' },
        { label: 'Ujian', go: '', icon: 'clipboard-list' },
        { label: 'Nilai Siswa', go: '', icon: 'bar-chart-3' },
      ],
      admin: [
        { label: 'Ringkasan', go: 'admin', icon: 'layout-dashboard' },
        { label: 'Pengguna', go: '', icon: 'users' },
        { label: 'Kelas & Mapel', go: '', icon: 'book-open-check' },
        { label: 'Pengaturan', go: '', icon: 'settings' },
      ],
    };

    /* ===================== STATE ===================== */
    const freshEval = () => ({ teacher: teachers[0], ratings: {}, feedback: '', comment: '', submitted: false });
    const state = { view: 'login', role: 'siswa', loginRole: 'siswa', ev: freshEval() };
    const app = document.getElementById('app');

    /* ===================== HELPERS ===================== */
    const icon = (name, cls = 'h-5 w-5') => `<i data-lucide="${name}" class="${cls}"></i>`;
    const refreshIcons = () => window.lucide && lucide.createIcons();

    const badge = (variant, text) => {
      const v = { success: 'bg-mint text-mint-ink', pending: 'bg-coral text-coral-ink', info: 'bg-blush/30 text-rose-ink' }[variant];
      return `<span class="inline-flex items-center rounded-full px-3 py-1 text-xs font-bold ${v}">${text}</span>`;
    };
    const examBadge = (s) => badge({ Selesai: 'success', Segera: 'pending', Terjadwal: 'info' }[s], s);
    const studentBadge = (s) => badge({ Tuntas: 'success', Remedial: 'pending', Menunggu: 'info' }[s], s);

    const statCard = (ic, label, value, hint, tone = 'pink') => {
      const t = { pink: 'bg-blush/30 text-rose-ink', mint: 'bg-mint text-mint-ink', coral: 'bg-coral text-coral-ink' }[tone];
      return `
      <div class="rounded-2xl border border-dusty/20 bg-white p-5 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-soft">
        <div class="flex items-start justify-between gap-3">
          <div>
            <p class="text-sm font-semibold text-ink/70">${label}</p>
            <p class="mt-2 text-3xl font-extrabold">${value}</p>
            <p class="mt-1 text-xs text-ink/60">${hint}</p>
          </div>
          <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl ${t}">${icon(ic, 'h-6 w-6')}</span>
        </div>
      </div>`;
    };

    const tableCard = (title, desc, head, rows, action = '') => `
      <div class="rounded-2xl border border-dusty/20 bg-white shadow-sm">
        <div class="flex flex-col gap-3 p-5 sm:flex-row sm:items-center sm:justify-between sm:p-6">
          <div>
            <h3 class="text-lg font-extrabold text-rose-ink">${title}</h3>
            <p class="text-sm text-ink/70">${desc}</p>
          </div>
          ${action}
        </div>
        <div class="w-full overflow-x-auto">
          <table class="w-full min-w-[560px] text-left text-sm">
            <thead class="border-y border-dusty/30 bg-canvas">
              <tr>${head.map((h) => `<th class="whitespace-nowrap px-4 py-3 text-xs font-extrabold uppercase tracking-wide text-rose-ink">${h}</th>`).join('')}</tr>
            </thead>
            <tbody>
              ${rows.map((r) => `<tr class="border-b border-dusty/15 transition-colors last:border-0 hover:bg-blush/10">${r.map((c) => `<td class="px-4 py-3.5 align-middle">${c}</td>`).join('')}</tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;

    /* ===================== LOGIN ===================== */
    function loginView() {
      return `
      <div class="relative flex min-h-screen items-center justify-center overflow-hidden px-4 py-10">
        <div class="pointer-events-none absolute -left-24 -top-24 h-72 w-72 rounded-full bg-blush/30 blur-3xl"></div>
        <div class="pointer-events-none absolute -bottom-24 -right-24 h-80 w-80 rounded-full bg-dusty/25 blur-3xl"></div>

        <div class="fade-up relative w-full max-w-md rounded-2xl border border-dusty/20 bg-white p-6 shadow-md sm:p-8">
          <div class="mb-6 text-center">
            <span class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-2xl bg-dusty text-plum shadow-soft">${icon('graduation-cap', 'h-7 w-7')}</span>
            <h1 class="text-2xl font-extrabold text-rose-ink">Sistem Evaluasi Pendidikan</h1>
            <p class="mt-1 text-sm text-ink/70">Masuk untuk melanjutkan ke dasbormu</p>
          </div>

          <div class="mb-5 grid grid-cols-3 gap-2 rounded-2xl bg-canvas p-1.5">
            ${Object.entries(roles).map(([id, r]) => `
              <button type="button" data-role="${id}" class="role-tab flex flex-col items-center gap-1 rounded-xl py-2.5 text-xs font-bold transition-all duration-200 sm:text-sm">
                ${icon(r.icon)}${r.label}
              </button>`).join('')}
          </div>

          <form id="login-form" class="space-y-4">
            <div>
              <label for="email" class="mb-1.5 block text-sm font-bold text-rose-ink">Email</label>
              <div class="relative">
                <span class="pointer-events-none absolute left-3.5 top-3.5 text-dusty">${icon('mail', 'h-4 w-4')}</span>
                <input id="email" type="email" required placeholder="nama@sekolah.sch.id" class="field h-11 pl-10" />
              </div>
            </div>
            <div>
              <label for="password" class="mb-1.5 block text-sm font-bold text-rose-ink">Kata sandi</label>
              <div class="relative">
                <span class="pointer-events-none absolute left-3.5 top-3.5 text-dusty">${icon('lock', 'h-4 w-4')}</span>
                <input id="password" type="password" required placeholder="••••••••" class="field h-11 pl-10 pr-11" />
                <button type="button" data-action="toggle-pw" aria-label="Tampilkan kata sandi" class="absolute right-2 top-1.5 flex h-8 w-8 items-center justify-center rounded-lg text-rose-ink/70 transition-colors hover:bg-blush/20">
                  <span id="pw-icon">${icon('eye', 'h-4 w-4')}</span>
                </button>
              </div>
            </div>
            <div class="flex items-center justify-between text-sm">
              <label class="flex cursor-pointer items-center gap-2 text-ink/70">
                <input type="checkbox" class="h-4 w-4 rounded" style="accent-color:#D9A0B0" /> Ingat saya
              </label>
              <a href="#" class="font-bold text-rose-ink transition-colors hover:text-dusty">Lupa sandi?</a>
            </div>
            <button type="submit" class="btn btn-primary h-12 w-full text-base">
              ${icon('user-round')}<span id="login-label"></span>
            </button>
          </form>
          <p class="mt-5 text-center text-xs text-ink/50">Demo: isi email &amp; sandi apa saja untuk melihat dasbor.</p>
        </div>
      </div>`;
    }

    function paintLoginRole() {
      document.querySelectorAll('.role-tab').forEach((b) => {
        const active = b.dataset.role === state.loginRole;
        b.className = 'role-tab flex flex-col items-center gap-1 rounded-xl py-2.5 text-xs font-bold transition-all duration-200 sm:text-sm ' +
          (active ? 'bg-dusty text-plum shadow-sm' : 'text-ink/60 hover:bg-blush/20 hover:text-rose-ink');
      });
      const label = document.getElementById('login-label');
      if (label) label.textContent = 'Masuk sebagai ' + roles[state.loginRole].label;
    }

    /* ===================== SHELL ===================== */
    function sidebarInner(role) {
      const items = nav[role];
      const active = state.view;
      return `
      <div class="flex h-full flex-col gap-6 p-5">
        <a href="#" data-go="${role}" class="flex items-center gap-3">
          <span class="flex h-11 w-11 items-center justify-center rounded-2xl bg-dusty text-plum shadow-soft">${icon('graduation-cap', 'h-6 w-6')}</span>
          <span class="leading-tight">
            <span class="block text-base font-extrabold text-rose-ink">EvaluasiKu</span>
            <span class="block text-xs text-ink/60">Sistem Evaluasi Pendidikan</span>
          </span>
        </a>
        <nav class="flex flex-1 flex-col gap-1.5">
          ${items.map((it) => {
            const isActive = it.go && it.go === active;
            const cls = isActive
              ? 'bg-dusty text-plum shadow-sm'
              : 'text-ink/70 hover:translate-x-0.5 hover:bg-blush/20 hover:text-rose-ink';
            return `<a href="#" ${it.go ? `data-go="${it.go}"` : ''} class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-bold transition-all duration-200 ${cls}">${icon(it.icon)}${it.label}</a>`;
          }).join('')}
        </nav>
        <div class="rounded-2xl bg-canvas p-4">
          <p class="text-sm font-extrabold text-rose-ink">${roles[role].user}</p>
          <p class="mb-3 text-xs text-ink/60">${roles[role].label}</p>
          <a href="#" data-go="login" class="flex items-center gap-2 text-sm font-bold text-ink/70 transition-colors hover:text-rose-ink">${icon('log-out', 'h-4 w-4')} Keluar</a>
        </div>
      </div>`;
    }

    function shell(role) {
      const inner = sidebarInner(role);
      return `
      <div class="min-h-screen lg:flex">
        <aside class="sticky top-0 hidden h-screen w-72 shrink-0 border-r border-dusty/20 bg-white lg:block">${inner}</aside>

        <header class="sticky top-0 z-30 flex items-center justify-between border-b border-dusty/20 bg-white/90 px-4 py-3 backdrop-blur lg:hidden">
          <div class="flex items-center gap-2">
            <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-dusty text-plum">${icon('graduation-cap')}</span>
            <span class="font-extrabold text-rose-ink">EvaluasiKu</span>
          </div>
          <button data-action="menu-open" aria-label="Buka menu" class="flex h-10 w-10 items-center justify-center rounded-xl text-rose-ink transition-colors hover:bg-blush/20">${icon('menu', 'h-6 w-6')}</button>
        </header>

        <div id="drawer" class="pointer-events-none fixed inset-0 z-40 lg:hidden">
          <div id="drawer-bg" data-action="menu-close" class="absolute inset-0 bg-ink/30 opacity-0 transition-opacity duration-300"></div>
          <aside id="drawer-panel" class="absolute left-0 top-0 h-full w-72 max-w-[85%] -translate-x-full bg-white shadow-xl transition-transform duration-300">
            <button data-action="menu-close" aria-label="Tutup menu" class="absolute right-3 top-3 flex h-9 w-9 items-center justify-center rounded-xl text-rose-ink hover:bg-blush/20">${icon('x')}</button>
            ${inner}
          </aside>
        </div>

        <main class="min-w-0 flex-1 px-4 py-6 sm:px-8 sm:py-8">
          <div id="content" class="fade-up mx-auto max-w-6xl"></div>
        </main>
      </div>`;
    }

    function toggleDrawer(open) {
      const d = document.getElementById('drawer');
      if (!d) return;
      d.classList.toggle('pointer-events-none', !open);
      d.classList.toggle('pointer-events-auto', open);
      document.getElementById('drawer-bg').classList.toggle('opacity-0', !open);
      document.getElementById('drawer-bg').classList.toggle('opacity-100', open);
      document.getElementById('drawer-panel').classList.toggle('-translate-x-full', !open);
      document.getElementById('drawer-panel').classList.toggle('translate-x-0', open);
    }

    /* ===================== DASBOR ===================== */
    function siswaView() {
      return `
      <div class="space-y-6">
        <div>
          <h1 class="text-2xl font-extrabold text-rose-ink sm:text-3xl">Halo, Aulia! 🌸</h1>
          <p class="mt-1 text-ink/70">Selamat datang kembali. Berikut ringkasan belajarmu hari ini.</p>
        </div>
        <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
          ${statCard('trending-up', 'Nilai Rata-rata', '86,4', 'Naik 2,1 poin dari semester lalu', 'mint')}
          ${statCard('calendar-clock', 'Ujian Mendatang', '4', 'Terdekat: Senin, 19 Okt')}
          ${statCard('clipboard-check', 'Evaluasi Guru Belum Selesai', '3', 'Batas pengisian 25 Okt', 'coral')}
        </div>
        ${tableCard(
          'Ujian Terdekat',
          'Jadwal ujian dan ulangan untuk beberapa minggu ke depan.',
          ['Mata Pelajaran', 'Guru', 'Tanggal', 'Waktu', 'Status'],
          exams.map((e) => [`<span class="font-bold">${e.mapel}</span>`, `<span class="text-ink/80">${e.guru}</span>`, `<span class="whitespace-nowrap">${e.tanggal}</span>`, `<span class="whitespace-nowrap">${e.waktu}</span>`, examBadge(e.status)]),
          `<a href="#" data-go="evaluasi" class="btn h-9 bg-blush/30 px-4 text-rose-ink hover:bg-blush/50">Isi evaluasi guru ${icon('arrow-right', 'h-4 w-4')}</a>`
        )}
      </div>`;
    }

    function guruView() {
      return `
      <div class="space-y-6">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <h1 class="text-2xl font-extrabold text-rose-ink sm:text-3xl">Selamat pagi, Bu Sari! ☀️</h1>
            <p class="mt-1 text-ink/70">Pantau perkembangan kelas dan buat ujian baru dengan cepat.</p>
          </div>
          <button type="button" class="btn btn-primary h-12 px-6 text-base">${icon('plus')} Buat Ujian Baru</button>
        </div>
        <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
          ${statCard('book-open', 'Kelas Aktif', '5', 'XI IPA 1 – XI IPA 5')}
          ${statCard('users', 'Total Siswa', '158', 'Seluruh kelas yang diampu')}
          ${statCard('line-chart', 'Rata-rata Nilai Kelas', '79,6', 'Naik 1,4 poin bulan ini', 'mint')}
        </div>
        ${tableCard(
          'Performa Siswa Terbaru',
          'Hasil ulangan terakhir dari kelas yang kamu ajar.',
          ['Siswa', 'Kelas', 'Ujian', 'Nilai', 'Status'],
          students.map((s) => [
            `<span class="font-bold">${s.nama}</span>`,
            `<span class="whitespace-nowrap">${s.kelas}</span>`,
            `<span class="text-ink/80">${s.ujian}</span>`,
            s.status === 'Menunggu'
              ? '<span class="text-ink/40">–</span>'
              : `<div class="flex items-center gap-2"><div class="h-2 w-16 overflow-hidden rounded-full bg-blush/30"><div class="h-full rounded-full bg-dusty" style="width:${s.nilai}%"></div></div><span class="font-bold">${s.nilai}</span></div>`,
            studentBadge(s.status),
          ])
        )}
      </div>`;
    }

    function adminView() {
      return `
      <div class="space-y-6">
        <div>
          <h1 class="text-2xl font-extrabold text-rose-ink sm:text-3xl">Dasbor Admin</h1>
          <p class="mt-1 text-ink/70">Ringkasan pengguna dan aktivitas evaluasi sekolah.</p>
        </div>
        <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
          ${statCard('users', 'Total Pengguna', '1.248', '1.190 siswa · 58 guru')}
          ${statCard('school', 'Kelas Aktif', '36', 'Tahun ajaran 2026/2027', 'mint')}
          ${statCard('message-square-heart', 'Evaluasi Masuk', '842', 'Semester ini')}
        </div>
        ${tableCard(
          'Pengguna Terbaru',
          'Akun yang baru didaftarkan atau menunggu verifikasi.',
          ['Nama', 'Peran', 'Email', 'Status'],
          users.map((u) => [`<span class="font-bold">${u.nama}</span>`, u.peran, `<span class="text-ink/80">${u.email}</span>`, badge(u.status === 'Aktif' ? 'success' : 'pending', u.status)])
        )}
      </div>`;
    }

    /* ===================== FORM EVALUASI ===================== */
    const starStyle = (on) => (on ? 'fill:#FDB0C0;color:#D9A0B0' : 'fill:transparent;color:rgba(217,160,176,.5)');
    const card = (title, desc, body) => `
      <div class="rounded-2xl border border-dusty/20 bg-white shadow-sm">
        <div class="p-5 sm:p-6"><h3 class="text-lg font-extrabold text-rose-ink">${title}</h3>${desc ? `<p class="text-sm text-ink/70">${desc}</p>` : ''}</div>
        <div class="p-5 pt-0 sm:p-6 sm:pt-0">${body}</div>
      </div>`;

    function evaluasiView() {
      const ev = state.ev;
      if (ev.submitted) {
        return `
        <div class="mx-auto max-w-xl rounded-2xl border border-dusty/20 bg-white p-8 text-center shadow-sm">
          <span class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-mint text-mint-ink">${icon('check-circle-2', 'h-8 w-8')}</span>
          <h2 class="text-xl font-extrabold text-rose-ink">Terima kasih atas evaluasimu!</h2>
          <p class="mx-auto mt-2 max-w-sm text-sm text-ink/70">Evaluasi untuk <span class="font-bold">${ev.teacher}</span> telah terkirim secara anonim. Masukanmu membantu pembelajaran jadi lebih baik.</p>
          <button type="button" data-action="reset-eval" class="btn btn-primary mt-6 h-11 px-5">Isi evaluasi guru lain</button>
        </div>`;
      }
      const answered = Object.keys(ev.ratings).length + (ev.feedback ? 1 : 0);
      const total = ratingQs.length + 1;
      const complete = answered === total;

      return `
      <div class="mx-auto max-w-3xl space-y-6">
        <div>
          <h1 class="text-2xl font-extrabold text-rose-ink sm:text-3xl">Evaluasi Guru</h1>
          <p class="mt-1 text-ink/70">Bantu guru berkembang dengan memberikan penilaian jujur tentang cara mengajar.</p>
        </div>

        <form id="eval-form" class="space-y-5">
          <div class="flex items-start gap-3 rounded-2xl bg-mint/60 p-4 text-sm text-mint-ink">
            <span class="mt-0.5 shrink-0">${icon('shield-check')}</span>
            <p><span class="font-extrabold">Evaluasi ini anonim.</span> Identitasmu tidak akan ditampilkan kepada guru maupun pihak lain.</p>
          </div>

          ${card('Pilih guru yang dievaluasi', '', `
            <label for="guru" class="mb-1.5 block text-sm font-bold text-rose-ink">Guru &amp; mata pelajaran</label>
            <select id="guru" class="field h-11">${teachers.map((t) => `<option ${t === ev.teacher ? 'selected' : ''}>${t}</option>`).join('')}</select>
          `)}

          ${card('Penilaian cara mengajar', 'Beri 1 (sangat kurang) sampai 5 (sangat baik) bintang.', `
            <div class="space-y-4">
              ${ratingQs.map((q, i) => {
                const val = ev.ratings[q.id] || 0;
                return `
                <div class="rounded-xl border border-dusty/15 p-4 transition-colors hover:bg-blush/10">
                  <p class="mb-2 text-sm font-semibold">${i + 1}. ${q.text}</p>
                  <div class="flex flex-wrap items-center gap-3">
                    <div class="star-group flex gap-1" data-q="${q.id}" data-value="${val}">
                      ${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-star="${n}" aria-label="${n} bintang" class="rounded-lg p-1 transition-transform duration-150 hover:scale-110">${icon('star', 'h-7 w-7 transition-colors').replace('class=', `style="${starStyle(n <= val)}" class=`)}</button>`).join('')}
                    </div>
                    <span class="star-label text-xs font-semibold text-rose-ink">${val ? starLabels[val - 1] : 'Belum dinilai'}</span>
                  </div>
                </div>`;
              }).join('')}

              <div class="rounded-xl border border-dusty/15 p-4">
                <p class="mb-3 text-sm font-semibold">${ratingQs.length + 1}. Seberapa sering guru memberi umpan balik atas tugasmu?</p>
                <div class="flex flex-wrap gap-2">
                  ${fbOptions.map((o) => `<button type="button" data-fb="${o}" class="rounded-xl border px-4 py-2 text-sm font-bold transition-all duration-200 ${ev.feedback === o ? 'border-dusty bg-dusty text-plum shadow-sm' : 'border-dusty/40 bg-white text-ink/70 hover:border-dusty hover:bg-blush/20'}">${o}</button>`).join('')}
                </div>
              </div>
            </div>
          `)}

          ${card('Kritik &amp; saran', 'Opsional. Tuliskan hal baik atau hal yang bisa ditingkatkan.', `
            <textarea id="comment" maxlength="500" placeholder="Contoh: Penjelasan sudah bagus, mungkin bisa ditambah contoh soal..." class="field min-h-[120px] resize-y py-3">${ev.comment}</textarea>
            <p class="mt-1 text-right text-xs text-ink/50"><span id="comment-count">${ev.comment.length}</span>/500</p>
          `)}

          <div class="flex flex-col items-stretch gap-3 sm:flex-row sm:items-center sm:justify-between">
            <div class="flex items-center gap-3">
              <div class="h-2 w-40 overflow-hidden rounded-full bg-blush/30"><div class="h-full rounded-full bg-dusty transition-all duration-300" style="width:${(answered / total) * 100}%"></div></div>
              <span class="text-xs font-semibold text-ink/70">${answered}/${total} terjawab</span>
            </div>
            <button type="submit" ${complete ? '' : 'disabled'} class="btn btn-primary h-12 px-6 text-base">Kirim Evaluasi</button>
          </div>
        </form>
      </div>`;
    }

    /* ===================== RENDER ===================== */
    const views = { siswa: siswaView, guru: guruView, admin: adminView, evaluasi: evaluasiView };

    function renderContent() {
      const c = document.getElementById('content');
      if (c) { c.innerHTML = views[state.view](); refreshIcons(); }
    }

    function go(view) {
      if (view === 'login') {
        state.view = 'login';
        state.ev = freshEval();
        app.innerHTML = loginView();
        paintLoginRole();
        refreshIcons();
        window.scrollTo(0, 0);
        return;
      }
      state.view = view;
      app.innerHTML = shell(state.role);
      renderContent();
      refreshIcons();
      window.scrollTo(0, 0);
    }

    /* ===================== EVENTS ===================== */
    function paintStars(group, n) {
      group.querySelectorAll('[data-star]').forEach((b, i) => {
        const svg = b.querySelector('svg');
        if (svg) svg.setAttribute('style', starStyle(i + 1 <= n));
      });
      const label = group.parentElement.querySelector('.star-label');
      if (label) label.textContent = n ? starLabels[n - 1] : 'Belum dinilai';
    }

    document.addEventListener('click', (e) => {
      const goEl = e.target.closest('[data-go]');
      if (goEl) {
        e.preventDefault();
        toggleDrawer(false);
        go(goEl.dataset.go);
        return;
      }
      if (e.target.closest('a[href="#"]')) e.preventDefault();

      const roleBtn = e.target.closest('[data-role]');
      if (roleBtn) { state.loginRole = roleBtn.dataset.role; paintLoginRole(); return; }

      const act = e.target.closest('[data-action]');
      if (act) {
        const a = act.dataset.action;
        if (a === 'menu-open') toggleDrawer(true);
        if (a === 'menu-close') toggleDrawer(false);
        if (a === 'toggle-pw') {
          const pw = document.getElementById('password');
          const show = pw.type === 'password';
          pw.type = show ? 'text' : 'password';
          document.getElementById('pw-icon').innerHTML = icon(show ? 'eye-off' : 'eye', 'h-4 w-4');
          refreshIcons();
        }
        if (a === 'reset-eval') { state.ev = freshEval(); renderContent(); }
        return;
      }

      const star = e.target.closest('[data-star]');
      if (star) {
        const q = star.closest('.star-group').dataset.q;
        state.ev.ratings[q] = Number(star.dataset.star);
        renderContent();
        return;
      }
      const fb = e.target.closest('[data-fb]');
      if (fb) { state.ev.feedback = fb.dataset.fb; renderContent(); }
    });

    // Pratinjau bintang saat hover
    document.addEventListener('mouseover', (e) => {
      const star = e.target.closest('[data-star]');
      if (star) paintStars(star.closest('.star-group'), Number(star.dataset.star));
    });
    document.addEventListener('mouseout', (e) => {
      const star = e.target.closest('[data-star]');
      if (star) {
        const g = star.closest('.star-group');
        paintStars(g, Number(g.dataset.value));
      }
    });

    document.addEventListener('input', (e) => {
      if (e.target.id === 'comment') {
        state.ev.comment = e.target.value;
        document.getElementById('comment-count').textContent = e.target.value.length;
      }
    });
    document.addEventListener('change', (e) => {
      if (e.target.id === 'guru') state.ev.teacher = e.target.value;
    });

    document.addEventListener('submit', (e) => {
      e.preventDefault();
      if (e.target.id === 'login-form') {
        state.role = state.loginRole;
        go(state.role);
      }
      if (e.target.id === 'eval-form') {
        const complete = Object.keys(state.ev.ratings).length === ratingQs.length && state.ev.feedback;
        if (complete) { state.ev.submitted = true; renderContent(); window.scrollTo(0, 0); }
      }
    });

    /* ===================== START ===================== */
    go('login');
  </script>
</body>
</html>
